<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Dateo</title>
    <!-- Icône utilisée par iOS (Safari, « Ajouter à l'écran d'accueil ») : carrée et opaque -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="apple-mobile-web-app-title" content="Dateo" />
    <meta name="theme-color" content="#FFF8F5" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Mêmes règles que app/+html.tsx (qui n'est utilisé qu'en rendu statique) -->
    <style id="dateo-web-reset">
      html, body, #root {
        overflow-x: hidden;
        max-width: 100%;
      }
      input, textarea {
        outline: none;
      }
    </style>
  </head>

  <body>
    <noscript>
      Active JavaScript pour utiliser Dateo.
    </noscript>
    <div id="root"></div>
  </body>
</html>
